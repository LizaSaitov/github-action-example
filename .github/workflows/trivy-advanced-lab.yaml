name: trivy-advanced-lab

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Install Trivy CLI
        uses: ankurk91/install-trivy-cli-action@v2
        with:
         version: latest
         cache: true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run trivy scan
        run: trivy --version
